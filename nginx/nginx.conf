# =============================================================================
# CyberAI Assessment Platform — Production & Dev Aligned Nginx Configuration
# =============================================================================
# Pure HTTP Reverse Proxy (No SSL Certs Required)
# Upstreams : frontend (Next.js :3000) + backend (FastAPI :8000)
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Rate-limit zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=global_limit:20m rate=100r/s;

    # WebSocket connection upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Upstreams
    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    upstream backend {
        server backend:8000;
        keepalive 16;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # Primary HTTP Server (Port 80 Only - No SSL / No Certs)
    server {
        listen 80 default_server;
        server_name _;

        # Client limits
        client_max_body_size 50m;
        client_body_timeout  60s;
        client_header_timeout 30s;

        # Security headers
        add_header X-Frame-Options           "SAMEORIGIN"        always;
        add_header X-Content-Type-Options    "nosniff"           always;
        add_header X-XSS-Protection          "1; mode=block"     always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # Common proxy settings
        proxy_http_version      1.1;
        proxy_connect_timeout   60s;
        proxy_send_timeout      120s;
        proxy_read_timeout      120s;
        proxy_buffering         off;

        # Forward real client info
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE upgrade headers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ── /api/ — FastAPI backend ───────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            # Disable buffering for SSE streaming
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;

            proxy_pass http://backend;
        }

        # ── /docs /redoc /openapi.json — FastAPI Swagger UI ──────────────────
        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass http://backend;
        }

        # ── Static assets ────────────────────────────────────────────────────
        location ~* ^/_next/static/ {
            proxy_pass http://frontend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ── Everything else — Next.js frontend ───────────────────────────────
        location / {
            limit_req zone=global_limit burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://frontend;
        }

        # ── Health check endpoint ────────────────────────────────────────────
        location = /health {
            proxy_pass http://backend/health;
            access_log off;
        }

        # ── Deny hidden files ────────────────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
