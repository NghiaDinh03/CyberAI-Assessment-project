# docker-compose.prod.yml — Production deployment (Aligned with Dev Architecture)
# Sử dụng: docker-compose -f docker-compose.prod.yml up -d
#
# Kiến trúc:
# - Ollama Local Inference: gemma4:latest (Auditor), qwen2.5-coder:7b (Extractor), bge-m3:latest (Embedding)
# - SearXNG: Tìm kiếm web an toàn, riêng tư cục bộ
# - Backend: FastAPI production multi-worker với đầy đủ pipeline Multi-Agent & RAG
# - Frontend: Next.js production build
# - Nginx: Reverse proxy HTTP port 80, rate limiting, SSE streaming
# - Lưu trữ bền vững: Volumes cho SQLite, ChromaDB, uploads, exports và Ollama models

services:
  nginx:
    image: nginx:alpine
    container_name: cyberai-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cyberai-network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cyberai-backend:latest
    container_name: cyberai-backend
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - MODEL_NAME=${MODEL_NAME:-gemma4:latest}
      - SECURITY_MODEL_NAME=${SECURITY_MODEL_NAME:-gemma4:latest}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-bge-m3}
      - MODEL_1_EXTRACTOR=${MODEL_1_EXTRACTOR:-qwen2.5-coder:7b}
      - MODEL_2_AUDITOR=${MODEL_2_AUDITOR:-gemma4:latest}
      - MODEL_3_EMBEDDING=${MODEL_3_EMBEDDING:-bge-m3}
      - REQUIRED_MODEL_IDS=${REQUIRED_MODEL_IDS:-gemma4:latest,qwen2.5-coder:7b,bge-m3:latest}
      - MAX_TOKENS=-1
      - PREFER_LOCAL=${PREFER_LOCAL:-true}
      - CLOUD_LLM_API_URL=${CLOUD_LLM_API_URL:-https://open-claude.com/v1}
      - CLOUD_MODEL_NAME=${CLOUD_MODEL_NAME:-gemini-2.0-flash}
      - CLOUD_API_KEYS=${CLOUD_API_KEYS:-}
      - GOOGLE_AI_STUDIO_API_KEY=${GOOGLE_AI_STUDIO_API_KEY:-}
      - GOOGLE_AI_STUDIO_MODEL=${GOOGLE_AI_STUDIO_MODEL:-gemini-2.0-flash}
      - GOOGLE_AI_STUDIO_URL=${GOOGLE_AI_STUDIO_URL:-https://generativelanguage.googleapis.com/v1beta}
      - ISO_DOCS_PATH=/data/iso_documents
      - VECTOR_STORE_PATH=/data/vector_store
      - DATA_PATH=/data
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:3081,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:3000,http://127.0.0.1:3081}
      - JWT_SECRET=${JWT_SECRET:-cyberai-assessment-production-jwt-secret-key-32-chars-min}
      - RATE_LIMIT_CHAT=${RATE_LIMIT_CHAT:-10/minute}
      - RATE_LIMIT_ASSESS=${RATE_LIMIT_ASSESS:-3/minute}
      - RATE_LIMIT_BENCHMARK=${RATE_LIMIT_BENCHMARK:-5/minute}
      - INFERENCE_TIMEOUT=${INFERENCE_TIMEOUT:-1800}
      - CLOUD_TIMEOUT=${CLOUD_TIMEOUT:-600}
      - WORKERS=${WORKERS:-2}
      - MODELS_PATH=/app/models
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
    networks:
      - cyberai-network
    volumes:
      - ./backend:/app
      - ./models/llm:/app/models
      - ./data/iso_documents:/data/iso_documents
      - ./data/vector_store:/data/vector_store
      - ./data/assessments:/data/assessments
      - ./data/evidence:/data/evidence
      - ./data/exports:/data/exports
      - ./data/sessions:/data/sessions
      - ./data/standards:/data/standards
      - ./data/knowledge_base:/data/knowledge_base
      - ./data/uploads:/data/uploads
    depends_on:
      searxng:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    image: cyberai-frontend:latest
    container_name: cyberai-frontend
    user: root
    ports:
      - "3081:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - API_URL=http://backend:8000
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./docs:/app/docs:ro
    networks:
      - cyberai-network
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          memory: 256M

  ollama:
    image: ollama/ollama:latest
    container_name: cyberai-ollama
    profiles:
      - ollama-container
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    entrypoint: ["/bin/sh", "-c", "ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done && (ollama list | grep -q 'gemma4' || ollama pull gemma4:latest) && (ollama list | grep -q 'qwen2.5-coder' || ollama pull qwen2.5-coder:7b) && (ollama list | grep -q 'bge-m3' || ollama pull bge-m3:latest); wait"]
    devices:
      - /dev/dxg:/dev/dxg
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_NUM_THREADS=10
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_LOAD_TIMEOUT=20m
      - OLLAMA_MAX_QUEUE=5
      - OLLAMA_FLASH_ATTENTION=true
      - OLLAMA_CONTEXT_LENGTH=4096
      - OLLAMA_DEBUG=INFO
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - cyberai-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "10"
          memory: 12G
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  searxng:
    image: searxng/searxng:latest
    container_name: cyberai-searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    networks:
      - cyberai-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          memory: 128M

networks:
  cyberai-network:
    driver: bridge

volumes:
  ollama_data:

